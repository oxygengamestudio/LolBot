name: Production Docker Pterodactyl

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'pterodactyl/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lolbot-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Shared quality gate
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
      security-events: write

  docker:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Resolve image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          provenance: false
          build-args: |
            BOT_BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.image }}:prod
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}

      - name: Run image doctor
        env:
          IMAGE_REF: ${{ steps.image.outputs.image }}:${{ github.sha }}
        run: docker run --rm --entrypoint node "$IMAGE_REF" dist/doctor.js

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: true
          token: ${{ github.token }}

      - name: Scan and block all high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          exit-code: '1'
          timeout: 10m
          skip-setup-trivy: true

      - name: Push validated image
        run: |
          docker push "${{ steps.image.outputs.image }}:prod"
          docker push "${{ steps.image.outputs.image }}:latest"
          docker push "${{ steps.image.outputs.image }}:${{ github.sha }}"

  restart:
    name: Restart Pterodactyl prod
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Setup Node for readiness probe
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Restart server through Pterodactyl API
        env:
          PTERO_URL: ${{ secrets.PTERO_URL }}
          PTERO_CLIENT_API_KEY: ${{ secrets.PTERO_CLIENT_API_KEY }}
          PTERO_TARGET_SERVER_ID: ${{ secrets.PTERO_PROD_SERVER_ID }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          test -n "$PTERO_URL"
          test -n "$PTERO_CLIENT_API_KEY"
          test -n "$PTERO_TARGET_SERVER_ID"

          api_base="${PTERO_URL%/}/api/client"
          server_identifier="$PTERO_TARGET_SERVER_ID"

          if [[ "$PTERO_TARGET_SERVER_ID" == *-* ]]; then
            servers_json="$(mktemp)"
            if curl --silent --show-error --fail-with-body \
              "${api_base}" \
              --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
              --header "Accept: Application/vnd.pterodactyl.v1+json" \
              --output "$servers_json"; then
              resolved_identifier="$(jq -r --arg uuid "$PTERO_TARGET_SERVER_ID" '
                .data[]
                | select(.attributes.uuid == $uuid or .attributes.identifier == $uuid)
                | .attributes.identifier
              ' "$servers_json" | head -n 1)"
              if [ -n "$resolved_identifier" ] && [ "$resolved_identifier" != "null" ]; then
                server_identifier="$resolved_identifier"
              else
                server_identifier="${PTERO_TARGET_SERVER_ID%%-*}"
              fi
            else
              server_identifier="${PTERO_TARGET_SERVER_ID%%-*}"
            fi
          fi

          clear_body="$(mktemp)"
          clear_status="$(curl --silent --show-error \
            --request POST \
            "${api_base}/servers/${server_identifier}/command" \
            --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
            --header "Accept: Application/vnd.pterodactyl.v1+json" \
            --header "Content-Type: application/json" \
            --data '{"command":"lolbot:clear-console"}' \
            --output "$clear_body" \
            --write-out "%{http_code}")"

          if [ "$clear_status" = "204" ]; then
            echo "Pterodactyl console clear command sent."
            sleep 1
          else
            echo "Pterodactyl console clear command failed with HTTP ${clear_status}; continuing restart."
            cat "$clear_body"
          fi

          before_resources="$(mktemp)"
          curl --silent --show-error --fail-with-body \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 5 \
            --max-time 20 \
            "${api_base}/servers/${server_identifier}/resources" \
            --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
            --header "Accept: Application/vnd.pterodactyl.v1+json" \
            --output "$before_resources"
          before_state="$(jq -r '.attributes.current_state // "unknown"' "$before_resources")"
          before_uptime="$(jq -r '.attributes.resources.uptime // 0' "$before_resources")"
          test "$before_state" != "unknown"
          [[ "$before_uptime" =~ ^[0-9]+$ ]]

          response_body="$(mktemp)"
          status_code="$(curl --silent --show-error \
            --request POST \
            --connect-timeout 5 \
            --max-time 10 \
            "${api_base}/servers/${server_identifier}/power" \
            --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
            --header "Accept: Application/vnd.pterodactyl.v1+json" \
            --header "Content-Type: application/json" \
            --data '{"signal":"restart"}' \
            --output "$response_body" \
            --write-out "%{http_code}")"

          if [ "$status_code" = "204" ]; then
            echo "Pterodactyl production restart signal sent."
          else
            echo "Pterodactyl production restart failed with HTTP ${status_code}."
            cat "$response_body"
            exit 1
          fi

          restart_observed=false
          if [ "$before_state" = "offline" ]; then
            restart_observed=true
          fi
          state=unknown
          uptime="$before_uptime"
          for attempt in $(seq 1 30); do
            resources_json="$(mktemp)"
            if ! curl --silent --show-error --fail-with-body \
              --connect-timeout 5 \
              --max-time 10 \
              "${api_base}/servers/${server_identifier}/resources" \
              --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
              --header "Accept: Application/vnd.pterodactyl.v1+json" \
              --output "$resources_json"; then
              echo "Pterodactyl production resources temporarily unavailable (attempt ${attempt}/30); retrying."
              sleep 4
              continue
            fi
            state="$(jq -r '.attributes.current_state' "$resources_json")"
            uptime="$(jq -r '.attributes.resources.uptime // 0' "$resources_json")"
            [[ "$uptime" =~ ^[0-9]+$ ]]
            if [ "$state" != "running" ] || [ "$uptime" -lt "$before_uptime" ]; then
              restart_observed=true
            fi
            if [ "$state" = "running" ] && [ "$restart_observed" = "true" ]; then
              break
            fi
            sleep 4
          done
          test "$state" = "running"
          test "$restart_observed" = "true"

          startup_body="$(mktemp)"
          curl --silent --show-error --fail-with-body \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 5 \
            --max-time 20 \
            "${api_base}/servers/${server_identifier}/startup" \
            --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
            --header "Accept: Application/vnd.pterodactyl.v1+json" \
            --output "$startup_body"
          export PTERO_DATA_DIR="$(jq -er '
            .data[]
            | select(.attributes.env_variable == "DATA_DIR")
            | ((.attributes.server_value | select(type == "string" and length > 0))
              // .attributes.default_value)
            | select(type == "string" and length > 0)
          ' "$startup_body" | head -n 1)"
          readiness_file="$(node --input-type=module -e '
            import { posix } from "node:path";
            const root = "/home/container";
            const resolved = posix.resolve(root, process.env.PTERO_DATA_DIR);
            if (resolved !== root && !resolved.startsWith(`${root}/`)) {
              throw new Error("DATA_DIR must stay under /home/container for Pterodactyl readiness");
            }
            const relative = posix.relative(root, resolved);
            process.stdout.write(`/${relative ? `${relative}/` : ""}runtime-readiness.json`);
          ')"
          readiness_challenge="$(openssl rand -hex 32)"
          [[ "$readiness_challenge" =~ ^[0-9a-f]{64}$ ]]
          normalized_build_sha="${EXPECTED_BUILD_SHA,,}"
          [[ "$normalized_build_sha" =~ ^[0-9a-f]{40}$ ]]
          readiness_command="$(jq -cn --arg command "lolbot:ready ${readiness_challenge}" '{command: $command}')"
          readiness_confirmed=false
          receipt_status="not-requested"
          receipt_body=""

          for attempt in $(seq 1 30); do
            command_body="$(mktemp)"
            if ! command_status="$(curl --silent --show-error \
              --request POST \
              --connect-timeout 5 \
              --max-time 10 \
              "${api_base}/servers/${server_identifier}/command" \
              --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
              --header "Accept: Application/vnd.pterodactyl.v1+json" \
              --header "Content-Type: application/json" \
              --data "$readiness_command" \
              --output "$command_body" \
              --write-out "%{http_code}")"; then
              echo "Production readiness command network error (attempt ${attempt}/30); retrying."
              sleep 4
              continue
            fi

            if [ "$command_status" != "204" ]; then
              echo "Production readiness command temporarily unavailable with HTTP ${command_status} (attempt ${attempt}/30)."
              sleep 4
              continue
            fi

            receipt_body="$(mktemp)"
            if ! receipt_status="$(curl --silent --show-error \
              --get \
              --connect-timeout 5 \
              --max-time 10 \
              "${api_base}/servers/${server_identifier}/files/contents" \
              --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
              --header "Accept: Application/vnd.pterodactyl.v1+json" \
              --data-urlencode "file=${readiness_file}" \
              --output "$receipt_body" \
              --write-out "%{http_code}")"; then
              echo "Production readiness receipt network error (attempt ${attempt}/30); retrying."
              sleep 4
              continue
            fi

            now_ms="$(($(date +%s) * 1000))"
            if [ "$receipt_status" = "200" ] && jq -e \
              --arg challenge "$readiness_challenge" \
              --arg build "$normalized_build_sha" \
              --argjson nowMs "$now_ms" \
              '(.schemaVersion == 1)
                and (.challenge == $challenge)
                and (.buildSha == $build)
                and (.discordReady == true)
                and (.generatedAt | type == "string")
                and (.expiresAtMs | type == "number" and . >= $nowMs)' \
              "$receipt_body" >/dev/null; then
              readiness_confirmed=true
              break
            fi

            echo "Exact production readiness receipt not available yet (attempt ${attempt}/30); retrying."
            sleep 4
          done

          if [ "$readiness_confirmed" != "true" ]; then
            if [ "$receipt_status" = "200" ] && [ -n "$receipt_body" ] && jq -e 'type == "object"' "$receipt_body" >/dev/null 2>&1; then
              observed_build="$(jq -r 'if ((.buildSha | type) == "string" and (.buildSha | test("^[0-9a-fA-F]{40}$"))) then (.buildSha | ascii_downcase) else "invalid-or-missing" end' "$receipt_body")"
              observed_discord_ready="$(jq -r 'if (.discordReady | type) == "boolean" then (.discordReady | tostring) else "invalid-or-missing" end' "$receipt_body")"
              observed_generated_at="$(jq -r 'if ((.generatedAt | type) == "string" and (.generatedAt | test("^[0-9TZ:.-]{20,32}$"))) then .generatedAt else "invalid-or-missing" end' "$receipt_body")"
              echo "Production readiness mismatch: expected build ${EXPECTED_BUILD_SHA}; observed build ${observed_build}, discordReady=${observed_discord_ready}, generatedAt=${observed_generated_at}."
            else
              echo "Production readiness receipt unavailable after retries (HTTP ${receipt_status})."
            fi
            exit 1
          fi
          echo "Pterodactyl production running and Discord Ready confirmed for build ${EXPECTED_BUILD_SHA} through the file API."
