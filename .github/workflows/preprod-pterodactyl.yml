name: Preprod Docker Pterodactyl

on:
  push:
    branches:
      - pre-prod
    paths-ignore:
      - '**/*.md'
      - 'pterodactyl/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lolbot-preprod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Shared quality gate
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
      security-events: write

  docker:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/pre-prod'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Resolve image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          provenance: false
          build-args: |
            BOT_BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.image }}:preprod
            ${{ steps.image.outputs.image }}:${{ github.sha }}

      - name: Run image doctor
        env:
          IMAGE_REF: ${{ steps.image.outputs.image }}:${{ github.sha }}
        run: docker run --rm --entrypoint node "$IMAGE_REF" dist/doctor.js

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: true
          token: ${{ github.token }}

      - name: Scan and block all high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          timeout: 10m
          skip-setup-trivy: true

      - name: Push validated image
        run: |
          docker push "${{ steps.image.outputs.image }}:preprod"
          docker push "${{ steps.image.outputs.image }}:${{ github.sha }}"

  restart:
    name: Restart Pterodactyl preprod
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Setup Node for readiness probe
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Restart server through Pterodactyl API
        env:
          PTERO_URL: ${{ secrets.PTERO_URL }}
          PTERO_CLIENT_API_KEY: ${{ secrets.PTERO_CLIENT_API_KEY }}
          PTERO_TARGET_SERVER_ID: ${{ secrets.PTERO_PREPROD_SERVER_ID }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          test -n "$PTERO_URL"
          test -n "$PTERO_CLIENT_API_KEY"
          test -n "$PTERO_TARGET_SERVER_ID"

          api_base="${PTERO_URL%/}/api/client"
          server_identifier="$PTERO_TARGET_SERVER_ID"

          if [[ "$PTERO_TARGET_SERVER_ID" == *-* ]]; then
            servers_json="$(mktemp)"
            if curl --silent --show-error --fail-with-body \
              "${api_base}" \
              --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
              --header "Accept: Application/vnd.pterodactyl.v1+json" \
              --output "$servers_json"; then
              resolved_identifier="$(jq -r --arg uuid "$PTERO_TARGET_SERVER_ID" '
                .data[]
                | select(.attributes.uuid == $uuid or .attributes.identifier == $uuid)
                | .attributes.identifier
              ' "$servers_json" | head -n 1)"
              if [ -n "$resolved_identifier" ] && [ "$resolved_identifier" != "null" ]; then
                server_identifier="$resolved_identifier"
              else
                server_identifier="${PTERO_TARGET_SERVER_ID%%-*}"
              fi
            else
              server_identifier="${PTERO_TARGET_SERVER_ID%%-*}"
            fi
          fi

          clear_body="$(mktemp)"
          clear_status="$(curl --silent --show-error \
            --request POST \
            "${api_base}/servers/${server_identifier}/command" \
            --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
            --header "Accept: Application/vnd.pterodactyl.v1+json" \
            --header "Content-Type: application/json" \
            --data '{"command":"lolbot:clear-console"}' \
            --output "$clear_body" \
            --write-out "%{http_code}")"

          if [ "$clear_status" = "204" ]; then
            echo "Pterodactyl console clear command sent."
            sleep 1
          else
            echo "Pterodactyl console clear command failed with HTTP ${clear_status}; continuing restart."
            cat "$clear_body"
          fi

          before_resources="$(mktemp)"
          curl --silent --show-error --fail-with-body \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 5 \
            --max-time 20 \
            "${api_base}/servers/${server_identifier}/resources" \
            --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
            --header "Accept: Application/vnd.pterodactyl.v1+json" \
            --output "$before_resources"
          before_state="$(jq -r '.attributes.current_state // "unknown"' "$before_resources")"
          before_uptime="$(jq -r '.attributes.resources.uptime // 0' "$before_resources")"
          test "$before_state" != "unknown"
          [[ "$before_uptime" =~ ^[0-9]+$ ]]
          response_body="$(mktemp)"
          status_code="$(curl --silent --show-error \
            --request POST \
            "${api_base}/servers/${server_identifier}/power" \
            --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
            --header "Accept: Application/vnd.pterodactyl.v1+json" \
            --header "Content-Type: application/json" \
            --data '{"signal":"restart"}' \
            --output "$response_body" \
            --write-out "%{http_code}")"

          if [ "$status_code" = "204" ]; then
            echo "Pterodactyl restart signal sent."
          else
            echo "Pterodactyl restart failed with HTTP ${status_code}."
            cat "$response_body"
            exit 1
          fi

          restart_observed=false
          if [ "$before_state" = "offline" ]; then
            restart_observed=true
          fi
          state=unknown
          uptime="$before_uptime"
          for attempt in $(seq 1 30); do
            resources_json="$(mktemp)"
            if ! curl --silent --show-error --fail-with-body \
              --connect-timeout 5 \
              --max-time 10 \
              "${api_base}/servers/${server_identifier}/resources" \
              --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
              --header "Accept: Application/vnd.pterodactyl.v1+json" \
              --output "$resources_json"; then
              echo "Pterodactyl resources temporarily unavailable (attempt ${attempt}/30); retrying."
              sleep 4
              continue
            fi
            state="$(jq -r '.attributes.current_state' "$resources_json")"
            uptime="$(jq -r '.attributes.resources.uptime // 0' "$resources_json")"
            [[ "$uptime" =~ ^[0-9]+$ ]]
            if [ "$state" != "running" ] || [ "$uptime" -lt "$before_uptime" ]; then
              restart_observed=true
            fi
            if [ "$state" = "running" ] && [ "$restart_observed" = "true" ]; then
              break
            fi
            sleep 4
          done
          test "$state" = "running"
          test "$restart_observed" = "true"

          websocket_json="$(mktemp)"
          curl --silent --show-error --fail-with-body \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 5 \
            --max-time 20 \
            "${api_base}/servers/${server_identifier}/websocket" \
            --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
            --header "Accept: Application/vnd.pterodactyl.v1+json" \
            --output "$websocket_json"

          export PTERO_WS_URL="$(jq -r '.data.socket' "$websocket_json")"
          export PTERO_WS_TOKEN="$(jq -r '.data.token' "$websocket_json")"
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';

          const url = process.env.PTERO_WS_URL;
          const token = process.env.PTERO_WS_TOKEN;
          const expectedBuildSha = process.env.EXPECTED_BUILD_SHA;
          if (!url || !token || url === 'null' || token === 'null') {
            throw new Error('Pterodactyl websocket credentials unavailable');
          }
          if (!expectedBuildSha || !/^[0-9a-f]{40}$/i.test(expectedBuildSha)) {
            throw new Error('Expected GitHub build SHA unavailable');
          }

          const challenge = randomBytes(32).toString('hex');
          const normalizedBuildSha = expectedBuildSha.toLowerCase();
          const expectedReadinessLine =
            ` INFO  [Readiness] challenge=${challenge} `
            + `build=${normalizedBuildSha} discordReady=true`;
          const isExpectedReadiness = (line) => {
            if (line.length !== 23 + expectedReadinessLine.length) return false;
            const timestamp = line.slice(0, 23);
            if (!Number.isFinite(Date.parse(`${timestamp.replace(' ', 'T')}Z`))) return false;
            return line.slice(23) === expectedReadinessLine;
          };

          await new Promise((resolve, reject) => {
            const maxConnectionAttempts = 8;
            let connectionAttempt = 0;
            let currentSocket;
            let currentChallengeTimer;
            let reconnectTimer;
            let settled = false;

            const closeCurrentSocket = () => {
              try { currentSocket?.close(); } catch { /* best effort */ }
              currentSocket = undefined;
            };
            const cleanup = () => {
              clearTimeout(timeout);
              clearTimeout(reconnectTimer);
              clearInterval(currentChallengeTimer);
              currentChallengeTimer = undefined;
              closeCurrentSocket();
            };
            const fail = (error) => {
              if (settled) return;
              settled = true;
              cleanup();
              reject(error);
            };
            const succeed = () => {
              if (settled) return;
              settled = true;
              cleanup();
              resolve();
            };
            const timeout = setTimeout(() => {
              fail(new Error(
                `Build ${expectedBuildSha} and Discord Ready markers not observed in order within 120 seconds`
              ));
            }, 120_000);

            const connect = () => {
              if (settled) return;
              connectionAttempt += 1;
              const socket = new WebSocket(url);
              currentSocket = socket;
              let terminal = false;
              const attemptTimeout = setTimeout(() => retry(), 15_000);

              const retry = () => {
                if (terminal || settled) return;
                terminal = true;
                clearTimeout(attemptTimeout);
                clearInterval(currentChallengeTimer);
                currentChallengeTimer = undefined;
                try { socket.close(); } catch { /* best effort */ }
                if (connectionAttempt >= maxConnectionAttempts) {
                  fail(new Error(
                    `Pterodactyl websocket readiness probe failed after ${maxConnectionAttempts} attempts`
                  ));
                  return;
                }
                const delayMs = Math.min(1_000 * (2 ** (connectionAttempt - 1)), 8_000);
                console.warn(
                  `Pterodactyl websocket temporarily unavailable `
                  + `(attempt ${connectionAttempt}/${maxConnectionAttempts}); retrying in ${delayMs}ms.`
                );
                reconnectTimer = setTimeout(connect, delayMs);
              };

              socket.addEventListener('open', () => {
                if (terminal || settled) return;
                try {
                  socket.send(JSON.stringify({ event: 'auth', args: [token] }));
                } catch {
                  retry();
                }
              });
              socket.addEventListener('message', (message) => {
                if (terminal || settled) return;
                let payload;
                try { payload = JSON.parse(String(message.data)); } catch { return; }
                if (payload.event === 'auth success') {
                  clearTimeout(attemptTimeout);
                  const sendChallenge = () => {
                    if (terminal || settled) return;
                    try {
                      socket.send(JSON.stringify({
                        event: 'send command',
                        args: [`lolbot:ready ${challenge}`],
                      }));
                    } catch {
                      retry();
                    }
                  };
                  sendChallenge();
                  if (terminal || settled) return;
                  currentChallengeTimer = setInterval(sendChallenge, 5_000);
                  return;
                }
                if (payload.event !== 'console output') return;
                const output = Array.isArray(payload.args) ? payload.args.join('\n') : String(payload.args ?? '');
                for (const line of output.split(/\r?\n/)) {
                  const plainLine = line.replace(/\x1B\[[0-?]*[ -/]*[@-~]/g, '');
                  if (isExpectedReadiness(plainLine)) {
                    clearInterval(currentChallengeTimer);
                    currentChallengeTimer = undefined;
                    succeed();
                    return;
                  }
                }
              });
              socket.addEventListener('error', retry);
              socket.addEventListener('close', retry);
            };

            connect();
          });
          console.log(`Pterodactyl running and Discord Ready confirmed for build ${expectedBuildSha}.`);
          NODE
