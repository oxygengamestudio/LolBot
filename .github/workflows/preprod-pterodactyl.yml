name: Preprod Docker Pterodactyl

on:
  push:
    branches:
      - pre-prod
    paths-ignore:
      - '**/*.md'
      - 'pterodactyl/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lolbot-preprod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    if: github.ref_name == 'pre-prod'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: |
          if compgen -G "test/*.test.ts" > /dev/null; then
            npm test
          else
            echo "No test/*.test.ts files found. Skipping tests."
          fi

      - name: Build
        run: npm run build

  docker:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BOT_BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.image }}:preprod
            ${{ steps.image.outputs.image }}:${{ github.sha }}

  restart:
    name: Restart Pterodactyl preprod
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Restart server through Pterodactyl API
        env:
          PTERO_URL: ${{ secrets.PTERO_URL }}
          PTERO_CLIENT_API_KEY: ${{ secrets.PTERO_CLIENT_API_KEY }}
          PTERO_TARGET_SERVER_ID: ${{ secrets.PTERO_PREPROD_SERVER_ID }}
        run: |
          set -euo pipefail

          if [ -z "$PTERO_TARGET_SERVER_ID" ]; then
            echo "PTERO_PREPROD_SERVER_ID is not set. Skipping Pterodactyl restart."
            exit 0
          fi

          test -n "$PTERO_URL"
          test -n "$PTERO_CLIENT_API_KEY"

          api_base="${PTERO_URL%/}/api/client"
          server_identifier="$PTERO_TARGET_SERVER_ID"

          if [[ "$PTERO_TARGET_SERVER_ID" == *-* ]]; then
            servers_json="$(mktemp)"
            if curl --silent --show-error --fail-with-body \
              "${api_base}" \
              --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
              --header "Accept: Application/vnd.pterodactyl.v1+json" \
              --output "$servers_json"; then
              resolved_identifier="$(jq -r --arg uuid "$PTERO_TARGET_SERVER_ID" '
                .data[]
                | select(.attributes.uuid == $uuid or .attributes.identifier == $uuid)
                | .attributes.identifier
              ' "$servers_json" | head -n 1)"
              if [ -n "$resolved_identifier" ] && [ "$resolved_identifier" != "null" ]; then
                server_identifier="$resolved_identifier"
              else
                server_identifier="${PTERO_TARGET_SERVER_ID%%-*}"
              fi
            else
              server_identifier="${PTERO_TARGET_SERVER_ID%%-*}"
            fi
          fi

          response_body="$(mktemp)"
          status_code="$(curl --silent --show-error \
            --request POST \
            "${api_base}/servers/${server_identifier}/power" \
            --header "Authorization: Bearer ${PTERO_CLIENT_API_KEY}" \
            --header "Accept: Application/vnd.pterodactyl.v1+json" \
            --header "Content-Type: application/json" \
            --data '{"signal":"restart"}' \
            --output "$response_body" \
            --write-out "%{http_code}")"

          if [ "$status_code" = "204" ]; then
            echo "Pterodactyl restart signal sent."
            exit 0
          fi

          echo "Pterodactyl restart failed with HTTP ${status_code}."
          cat "$response_body"
          exit 1
